<!DOCTYPE html>
<html lang="zh-CN" data-th="card">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>树洞广场</title>
<script>
  try {
    var t = localStorage.getItem('th_theme');
    if (t === 'card' || t === 'minimal') document.documentElement.dataset.th = t;
  } catch (e) {}
</script>
<style>
/* ═══════════ L1 语义 token（明暗两套） ═══════════ */
:root {
  --brand: #6366f1;
  --brand-2: #818cf8;
  --bg-page: #f4f5f7;
  --surface: #ffffff;
  --fill-1: #f2f4f7;
  --fill-2: #e8ebef;
  --text-1: #1f2329;
  --text-2: #6b7280;
  --text-3: #9ca3af;
  --line: #e5e7eb;
  --ring-bg: #e5e7eb;
  --lv-bg: rgba(99, 102, 241, .13);
  --danger: #e11d48;
  --shadow-1: 0 1px 3px rgba(16,24,40,.07), 0 4px 16px -6px rgba(16,24,40,.10);
  --shadow-2: 0 2px 10px -2px rgba(99,102,241,.35);
}
@media (prefers-color-scheme: dark) {
  :root {
    --brand: #818cf8;
    --brand-2: #a5b4fc;
    --bg-page: #0f1115;
    --surface: #1a1d23;
    --fill-1: #242830;
    --fill-2: #2e333c;
    --text-1: #e8eaed;
    --text-2: #9aa1ad;
    --text-3: #6b7280;
    --line: #2a2f38;
    --ring-bg: #2a2f38;
    --lv-bg: rgba(129, 140, 248, .16);
    --danger: #fb7185;
    --shadow-1: 0 1px 3px rgba(0,0,0,.4), 0 4px 16px -6px rgba(0,0,0,.5);
    --shadow-2: 0 2px 10px -2px rgba(129,140,248,.3);
  }
}

/* ═══════════ 主题预设：卡片风 ═══════════ */
html[data-th="card"] {
  --page-bg: var(--bg-page);
  --feed-gap: 14px;
  --post-pad: 18px 20px;
  --post-radius: 18px;
  --post-bg: var(--surface);
  --post-shadow: var(--shadow-1);
  --post-accent: 0px;
  --post-line: transparent;
  --avatar-size: 46px;
  --ring-w: 2.5px;
  --avatar-display: grid;
  --who-layout: column;
  --who-gap: 1px;
  --name-size: 14.5px;
  --name-weight: 600;
  --meta-size: 12.5px;
  --act-bg: var(--fill-1);
  --act-radius: 999px;
  --act-pad: 6px 13px;
  --act-size: 13px;
  --reply-bg: var(--fill-1);
  --reply-radius: 12px;
  --reply-pad: 10px 14px;
  --reply-indent: 56px;
}
/* ═══════════ 主题预设：极简风 ═══════════ */
html[data-th="minimal"] {
  --page-bg: var(--surface);
  --feed-gap: 0px;
  --post-pad: 16px 0 16px 14px;
  --post-radius: 0px;
  --post-bg: transparent;
  --post-shadow: none;
  --post-accent: 3px;
  --post-line: var(--line);
  --avatar-size: 0px;
  --ring-w: 0px;
  --avatar-display: none;
  --who-layout: row;
  --who-gap: 10px;
  --name-size: 13.5px;
  --name-weight: 500;
  --meta-size: 12.5px;
  --act-bg: transparent;
  --act-radius: 6px;
  --act-pad: 2px 6px;
  --act-size: 13px;
  --reply-bg: transparent;
  --reply-radius: 0px;
  --reply-pad: 2px 0 2px 12px;
  --reply-indent: 0px;
}

/* ═══════════ 基础 ═══════════ */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page-bg);
  color: var(--text-1);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background-color .38s ease;
}
.th { max-width: 720px; margin: 0 auto; padding: 22px 20px 90px; }
button { font-family: inherit; }
input, textarea, select { font-family: inherit; }

/* ═══════════ 页头 ═══════════ */
.th-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.th-title { display: flex; align-items: baseline; gap: 9px; flex: 1; min-width: 0; flex-wrap: wrap; }
.th-title h1 { font-size: 21px; margin: 0; letter-spacing: -.2px; }
.th-title .sub { font-size: 12.5px; color: var(--text-3); }

.switch { display: flex; padding: 3px; gap: 2px; background: var(--fill-1); border-radius: 10px; flex: none; }
.switch button {
  border: 0; background: transparent; color: var(--text-2);
  font-size: 13px; padding: 6px 13px; border-radius: 8px;
  cursor: pointer; transition: all .22s ease;
}
.switch button:hover { color: var(--text-1); }
.switch button.on { background: var(--surface); color: var(--brand); font-weight: 600; box-shadow: var(--shadow-2); }

/* ═══════════ 我的身份条 ═══════════ */
.me-line {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 12.5px; color: var(--text-2);
  padding: 0 2px 12px;
}
.me-line .me-face {
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  font-size: 13px; background: linear-gradient(135deg, var(--a, #a5b4fc), var(--b, #6366f1));
  flex: none;
}
.me-line b { color: var(--text-1); font-weight: 600; }
.me-line .n { color: var(--text-3); }
.me-line .bar {
  height: 3px; width: 52px; border-radius: 3px; overflow: hidden;
  background: var(--ring-bg); flex: none;
}
.me-line .bar i { display: block; height: 100%; background: var(--brand); border-radius: 3px; }

/* ═══════════ 分区 tab + 排序 ═══════════ */
.tabs-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
.th-tabs { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; flex: 1; min-width: 0; }
.th-tabs::-webkit-scrollbar { display: none; }
.th-tabs button {
  border: 0; font-size: 13px; white-space: nowrap;
  padding: 6px 14px; border-radius: 999px; cursor: pointer;
  background: var(--fill-1); color: var(--text-2); transition: all .22s ease;
}
.th-tabs button:hover { color: var(--text-1); }
.th-tabs button.on { background: var(--brand); color: #fff; font-weight: 600; }
.sort { display: flex; gap: 2px; padding: 3px; background: var(--fill-1); border-radius: 9px; flex: none; }
.sort button {
  border: 0; background: transparent; color: var(--text-2); cursor: pointer;
  font-size: 12px; padding: 5px 10px; border-radius: 7px; transition: all .2s ease;
}
.sort button.on { background: var(--surface); color: var(--brand); font-weight: 600; }

/* ═══════════ 发帖框 ═══════════ */
.th-composer {
  background: var(--post-bg); border-radius: var(--post-radius);
  box-shadow: var(--post-shadow); padding: 14px 16px; margin-bottom: 18px;
  transition: background-color .38s ease, border-radius .38s ease, box-shadow .38s ease;
}
html[data-th="minimal"] .th-composer { border-bottom: 1px solid var(--line); padding-left: 14px; }
.th-composer textarea {
  width: 100%; border: 0; resize: none; background: transparent;
  color: var(--text-1); font-size: 14.5px; line-height: 1.65;
  outline: none; min-height: 56px; display: block;
}
.th-composer textarea::placeholder { color: var(--text-3); }
.th-composer-bar { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.cat-sel {
  border: 0; background: var(--fill-1); color: var(--text-2);
  font-size: 12.5px; padding: 6px 10px; border-radius: 8px; cursor: pointer;
  outline: none; flex: none;
}
.cat-sel:hover { color: var(--text-1); }
.th-hint { font-size: 12px; color: var(--text-3); margin-left: auto; font-variant-numeric: tabular-nums; }
.th-send {
  border: 0; font-size: 13.5px; font-weight: 600; cursor: pointer; flex: none;
  padding: 7px 20px; border-radius: 999px; color: #fff;
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  transition: transform .18s ease, opacity .18s ease;
}
.th-send:hover { transform: translateY(-1px); }
.th-send:active { transform: translateY(0); }
.th-send:disabled { opacity: .55; cursor: default; transform: none; }

/* ═══════════ 帖子流 ═══════════ */
.th-feed { display: flex; flex-direction: column; gap: var(--feed-gap); }
.th-post {
  background: var(--post-bg);
  border-radius: var(--post-radius);
  box-shadow: var(--post-shadow);
  padding: var(--post-pad);
  border-left: var(--post-accent) solid var(--brand);
  border-bottom: 1px solid var(--post-line);
  transition: background-color .38s ease, border-radius .38s ease, box-shadow .38s ease,
              padding .38s ease, border-color .38s ease;
}
.th-post-head { display: flex; align-items: flex-start; gap: 12px; }

.ring {
  display: var(--avatar-display);
  flex: none; width: var(--avatar-size); height: var(--avatar-size);
  border-radius: 50%; padding: var(--ring-w);
  background: conic-gradient(var(--brand) calc(var(--p, 0) * 1%), var(--ring-bg) 0);
  transition: all .38s ease;
}
.avatar {
  width: 100%; height: 100%; border-radius: 50%;
  display: grid; place-items: center; font-size: 20px;
  background: linear-gradient(135deg, var(--a, #a5b4fc), var(--b, #6366f1));
}

.who {
  flex: 1; min-width: 0;
  display: flex; flex-direction: var(--who-layout);
  align-items: baseline; gap: var(--who-gap); flex-wrap: wrap;
}
.name {
  font-size: var(--name-size); font-weight: var(--name-weight);
  color: var(--text-1); display: flex; align-items: center; gap: 6px; min-width: 0;
}
.lv {
  font-size: 10.5px; font-weight: 700; letter-spacing: .2px; flex: none;
  padding: 1px 6px; border-radius: 5px; color: var(--brand); background: var(--lv-bg);
}
.meta { font-size: var(--meta-size); color: var(--text-3); }
.meta .dot { margin: 0 5px; opacity: .5; }
.meta .tag {
  color: var(--text-2); background: var(--fill-1);
  padding: 1px 7px; border-radius: 5px; font-size: 11.5px;
}
.pin { font-size: 11px; color: var(--brand); font-weight: 600; }
.mine-mark { font-size: 11px; color: var(--text-3); }

.th-body {
  font-size: 15px; line-height: 1.72; color: var(--text-1);
  margin: 12px 0 0; white-space: pre-wrap; word-break: break-word;
}
html[data-th="minimal"] .th-body { margin-top: 7px; }
.th-img { max-width: 100%; border-radius: 12px; margin-top: 10px; display: block; }

/* ═══════════ 操作栏 ═══════════ */
.acts { display: flex; align-items: center; gap: 8px; margin-top: 13px; flex-wrap: wrap; }
html[data-th="minimal"] .acts { margin-top: 6px; }
.act {
  border: 0; font-size: var(--act-size); cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
  padding: var(--act-pad); border-radius: var(--act-radius);
  background: var(--act-bg); color: var(--text-2); transition: all .2s ease;
}
.act:hover { color: var(--brand); }
.act.on { color: var(--danger); }
.act.on .ic { transform: scale(1.15); }
.act .ic { transition: transform .18s ease; font-size: 14px; }
.act .n { font-variant-numeric: tabular-nums; }
.act.flag { margin-left: auto; }
.act:disabled { opacity: .5; cursor: default; }

/* ═══════════ 楼层回复 ═══════════ */
.replies { margin: 12px 0 0 var(--reply-indent); display: flex; flex-direction: column; gap: 6px; }
.reply {
  background: var(--reply-bg); border-radius: var(--reply-radius);
  padding: var(--reply-pad); font-size: 13.5px; line-height: 1.6;
  color: var(--text-2); transition: all .38s ease;
}
html[data-th="minimal"] .reply { border-left: 2px solid var(--line); }
.reply .rwho { color: var(--text-3); margin-right: 7px; font-size: 12.5px; }
.reply .rtext { color: var(--text-1); }
.reply.to-me .rwho { color: var(--brand); font-weight: 600; }
.reply-load {
  border: 0; background: transparent; color: var(--brand); cursor: pointer;
  font-size: 13px; padding: 4px 0; text-align: left;
}
.reply-load:hover { text-decoration: underline; }

.reply-box { margin: 8px 0 0 var(--reply-indent); display: flex; gap: 8px; align-items: center; }
.reply-box input {
  flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface);
  color: var(--text-1); font-size: 13px; padding: 8px 12px;
  border-radius: 999px; outline: none; transition: border-color .2s ease;
}
.reply-box input:focus { border-color: var(--brand); }
.reply-box button {
  border: 0; background: var(--brand); color: #fff; font-size: 12.5px; font-weight: 600;
  padding: 8px 16px; border-radius: 999px; cursor: pointer; flex: none;
}
.reply-box button:disabled { opacity: .55; cursor: default; }

/* ═══════════ 空态 / 加载 / 更多 ═══════════ */
.empty { text-align: center; padding: 56px 20px; color: var(--text-3); font-size: 14px; line-height: 2; }
.empty .big { font-size: 32px; display: block; margin-bottom: 8px; }
.loading { text-align: center; padding: 40px; color: var(--text-3); font-size: 13.5px; }
.more-wrap { text-align: center; padding: 22px 0 0; }
.more-wrap button {
  border: 1px solid var(--line); background: transparent; color: var(--text-2);
  font-size: 13px; padding: 9px 24px; border-radius: 999px; cursor: pointer;
}
.more-wrap button:hover { border-color: var(--brand); color: var(--brand); }

/* ═══════════ Toast ═══════════ */
#toast {
  position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 20px);
  background: var(--text-1); color: var(--page-bg);
  font-size: 13.5px; padding: 10px 20px; border-radius: 999px;
  opacity: 0; pointer-events: none; transition: all .28s ease; z-index: 99;
  max-width: 90vw; text-align: center;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div class="th">
  <header class="th-head">
    <div class="th-title">
      <h1 id="siteTitle">🕳️ 树洞广场</h1>
      <span class="sub" id="stat"></span>
    </div>
    <div class="switch" id="sw">
      <button data-set="card" class="on">卡片</button>
      <button data-set="minimal">极简</button>
    </div>
  </header>

  <div class="me-line" id="meLine" hidden></div>

  <div class="tabs-row">
    <nav class="th-tabs" id="tabs"></nav>
    <div class="sort" id="sort">
      <button data-sort="new" class="on">最新</button>
      <button data-sort="hot">最热</button>
    </div>
  </div>

  <div class="th-composer">
    <textarea id="box" placeholder="写下你想说的话…（匿名发送，所有人可见）" maxlength="1000"></textarea>
    <div class="th-composer-bar">
      <select class="cat-sel" id="catSel"></select>
      <span class="th-hint"><span id="cnt">0</span>/<span id="maxLen">1000</span></span>
      <button class="th-send" id="send">发送</button>
    </div>
  </div>

  <div class="th-feed" id="feed"></div>
  <div class="more-wrap" id="moreWrap" hidden><button id="moreBtn">加载更多</button></div>
</div>

<div id="toast"></div>

<script>
'use strict';

/* ════════════════ 状态 ════════════════ */
const LS_VID = 'th_visitor_id';
const LS_THEME = 'th_theme';

const S = {
  vid: null,
  me: null,
  cfg: { categories: ['生活', '学习', '情感', '吐槽', '求助'], max_message_length: 1000, site_title: '树洞广场' },
  cat: '',
  sort: 'new',
  limit: 30,
  items: [],
  total: 0,
  replies: {},      // msgId -> [reply]
  boxOpen: {},      // msgId -> bool（回复输入框是否展开）
  draft: {},        // msgId -> 草稿
  busy: false,
};

/* ════════════════ 工具 ════════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');

function timeAgo(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const sec = Math.floor((Date.now() - d.getTime()) / 1000);
  if (sec < 60) return '刚刚';
  if (sec < 3600) return Math.floor(sec / 60) + ' 分钟前';
  if (sec < 86400) return Math.floor(sec / 3600) + ' 小时前';
  const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  const dk = x => x.getFullYear() + '-' + x.getMonth() + '-' + x.getDate();
  const yst = new Date(); yst.setDate(yst.getDate() - 1);
  if (dk(d) === dk(yst)) return '昨天 ' + hm;
  if (d.getFullYear() === new Date().getFullYear()) return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
  return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

/* API 基址:?api=https://xxx 或 window.TREEHOLE_API_BASE 可覆盖;默认空 = 同域相对路径 */
const API_BASE = (function () {
  function strip(v) { v = String(v || ""); return v.endsWith("/") ? v.slice(0, -1) : v; }
  try {
    const q = new URLSearchParams(location.search).get("api");
    if (q) return strip(q);
  } catch (e) {}
  return strip(window.TREEHOLE_API_BASE || "");
})();
async function api(method, url, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) {
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(body);
  }
  let res, data = {};
  try {
    res = await fetch(API_BASE + url, opt);
  } catch (e) {
    throw new Error('连不上服务，请确认后端已启动');
  }
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(data.error || ('请求失败 HTTP ' + res.status));
  return data;
}

/* ════════════════ 身份 ════════════════ */
async function ensureIdentity() {
  const saved = localStorage.getItem(LS_VID);
  const r = await api('POST', '/api/visitor', { visitorId: saved || undefined });
  S.vid = r.visitorId;
  localStorage.setItem(LS_VID, S.vid);
}

async function loadMe() {
  const r = await api('POST', '/api/me', { visitorId: S.vid });
  S.me = r.me;
  renderMe();
}

function renderMe() {
  const el = $('#meLine');
  if (!S.me) { el.hidden = true; return; }
  const m = S.me;
  const shown = m.nickname || m.default_name;
  el.hidden = false;
  el.innerHTML =
    '<span class="me-face" style="--a:' + esc(m.color_a) + ';--b:' + esc(m.color_b) + '">' + esc(m.emoji) + '</span>' +
    '<span>你是 <b>' + esc(shown) + '</b></span>' +
    '<span class="lv">Lv.' + m.level + '</span>' +
    '<span class="n">' + esc(m.levelTitle) + '</span>' +
    '<span class="bar"><i style="width:' + m.progress + '%"></i></span>' +
    '<span class="n">发过 ' + m.postCount + ' 条 · 收到 ' + m.likeReceived + ' 个赞</span>' +
    (m.nextAt !== null ? '<span class="n">再 ' + Math.max(0, m.nextAt - m.score) + ' 分升级</span>' : '<span class="n">已满级</span>');
}

/* ════════════════ 主题 ════════════════ */
function applyTheme(th) {
  document.documentElement.dataset.th = th;
  try { localStorage.setItem(LS_THEME, th); } catch (e) {}
  document.querySelectorAll('#sw button').forEach(b => b.classList.toggle('on', b.dataset.set === th));
}
$('#sw').addEventListener('click', e => {
  const b = e.target.closest('button[data-set]');
  if (b) applyTheme(b.dataset.set);
});

/* ════════════════ 配置 ════════════════ */
async function loadConfig() {
  const c = await api('GET', '/api/config');
  S.cfg = c;
  document.title = c.site_title || '树洞广场';
  $('#siteTitle').textContent = '🕳️ ' + (c.site_title || '树洞广场');
  $('#maxLen').textContent = c.max_message_length;
  $('#box').maxLength = c.max_message_length;

  $('#tabs').innerHTML = '<button class="on" data-cat="">全部</button>' +
    (c.categories || []).map(x => '<button data-cat="' + esc(x) + '">' + esc(x) + '</button>').join('');
  $('#catSel').innerHTML = (c.categories || []).map(x => '<option value="' + esc(x) + '">' + esc(x) + '</option>').join('');
}

/* ════════════════ 帖子流 ════════════════ */
async function loadPosts(append) {
  if (!append) S.limit = 30;
  const q = new URLSearchParams();
  if (S.vid) q.set('viewer', S.vid);
  if (S.cat) q.set('category', S.cat);
  q.set('sort', S.sort);
  q.set('limit', S.limit);

  const r = await api('GET', '/api/messages?' + q.toString());
  S.items = r.items;
  S.total = r.total;
  S.today = r.today;
  S.replies = {};       // 换分类/换排序后回复缓存失效
  renderStat();
  renderFeed();
}

function renderStat() {
  $('#stat').textContent = S.total + ' 条 · 今日 +' + S.today;
}

function renderFeed() {
  const feed = $('#feed');
  $('#moreWrap').hidden = S.items.length >= S.total;

  if (!S.items.length) {
    feed.innerHTML = '<div class="empty"><span class="big">🕳️</span>这里还很安静<br>成为第一个说话的人吧</div>';
    return;
  }
  feed.innerHTML = S.items.map(renderPost).join('');
}

function renderPost(m) {
  const a = m.author;
  const shownName = a.display_name;
  const openReplies = S.replies[m.id];
  const rs = openReplies ? openReplies.map(r =>
    '<div class="reply' + (r.mine ? ' to-me' : '') + '">' +
      '<span class="rwho">' + esc((r.is_admin ? '👑 ' : '') + r.author.display_name) + '</span>' +
      '<span class="rtext">' + esc(r.content) + '</span>' +
    '</div>').join('') : '';
  const rsBlock = openReplies && openReplies.length
    ? '<div class="replies">' + rs + '</div>'
    : '';

  const replyLoader = !openReplies && m.reply_count > 0
    ? '<div class="replies"><button class="reply-load" data-open-replies="' + esc(m.id) + '">' +
        '💬 查看 ' + m.reply_count + ' 条回复' +
      '</button></div>'
    : '';

  const replyBox = S.boxOpen[m.id]
    ? '<div class="reply-box">' +
        '<input data-draft="' + esc(m.id) + '" maxlength="500" placeholder="回复这条…（匿名）" value="' + esc(S.draft[m.id] || '') + '">' +
        '<button data-send-reply="' + esc(m.id) + '">发送</button>' +
      '</div>'
    : '';

  return `
  <article class="th-post" data-post="${esc(m.id)}">
    <div class="th-post-head">
      <div class="ring" style="--p:${a.progress}">
        <div class="avatar" style="--a:${esc(a.color_a)};--b:${esc(a.color_b)}">${esc(a.emoji)}</div>
      </div>
      <div class="who">
        <div class="name">
          ${esc(shownName)}
          <span class="lv" title="${esc(a.level_title)}">Lv.${a.level}</span>
          ${m.is_pinned ? '<span class="pin">📌 置顶</span>' : ''}
          ${m.mine ? '<span class="mine-mark">我发的</span>' : ''}
        </div>
        <div class="meta">
          ${timeAgo(m.created_at)}
          <span class="dot">·</span><span class="tag">${esc(m.category)}</span>
        </div>
      </div>
    </div>
    <div class="th-body">${esc(m.content)}</div>
    ${m.image_url ? '<img class="th-img" src="' + esc(m.image_url) + '" alt="" loading="lazy" referrerpolicy="no-referrer">' : ''}
    <div class="acts">
      <button class="act like${m.liked_by_me ? ' on' : ''}" data-like="${esc(m.id)}">
        <span class="ic">${m.liked_by_me ? '❤️' : '🤍'}</span><span class="n">${m.like_count}</span>
      </button>
      <button class="act" data-toggle-reply="${esc(m.id)}">
        <span class="ic">💬</span><span class="n">${m.reply_count}</span>
      </button>
      <button class="act flag" title="举报（暂未开放）" disabled><span class="ic">⚑</span></button>
    </div>
    ${rsBlock}${replyLoader}${replyBox}
  </article>`;
}

/* ════════════════ 交互：帖子流（事件委托） ════════════════ */
$('#feed').addEventListener('click', async e => {
  const like = e.target.closest('[data-like]');
  if (like) return onLike(like);

  const open = e.target.closest('[data-open-replies]');
  if (open) return onOpenReplies(open);

  const box = e.target.closest('[data-toggle-reply]');
  if (box) return onToggleReplyBox(box.dataset.toggleReply, true);

  const send = e.target.closest('[data-send-reply]');
  if (send) return onSendReply(send);
});

$('#feed').addEventListener('input', e => {
  const inp = e.target.closest('[data-draft]');
  if (inp) S.draft[inp.dataset.draft] = inp.value;
});

$('#feed').addEventListener('keydown', e => {
  const inp = e.target.closest('[data-draft]');
  if (inp && e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const btn = document.querySelector('[data-send-reply="' + CSS.escape(inp.dataset.draft) + '"]');
    if (btn) onSendReply(btn);
  }
});

async function onLike(btn) {
  const id = btn.dataset.like;
  const m = S.items.find(x => x.id === id);
  if (!m || btn.disabled) return;

  const want = !m.liked_by_me;
  btn.disabled = true;
  try {
    const r = await api('POST', '/api/like', { visitorId: S.vid, messageId: id });
    m.liked_by_me = r.liked;
    m.like_count = r.like_count;
    btn.classList.toggle('on', r.liked);
    btn.querySelector('.ic').textContent = r.liked ? '❤️' : '🤍';
    btn.querySelector('.n').textContent = r.like_count;
  } catch (err) {
    toast(err.message);
  } finally {
    btn.disabled = false;
  }
}

async function onOpenReplies(btn) {
  const id = btn.dataset.openReplies;
  btn.textContent = '加载中…';
  try {
    const r = await api('GET', '/api/messages/' + encodeURIComponent(id) + '/replies');
    S.replies[id] = r.items;
    renderFeed();
  } catch (err) {
    toast(err.message);
    renderFeed();
  }
}

function onToggleReplyBox(id, forceOpen) {
  S.boxOpen[id] = forceOpen ? !S.boxOpen[id] : false;
  renderFeed();
  if (S.boxOpen[id]) {
    const inp = document.querySelector('[data-draft="' + CSS.escape(id) + '"]');
    if (inp) inp.focus();
  }
}

async function onSendReply(btn) {
  const id = btn.dataset.sendReply;
  const text = (S.draft[id] || '').trim();
  if (!text) { toast('回复不能为空'); return; }

  btn.disabled = true;
  btn.textContent = '发送中…';
  try {
    const r = await api('POST', '/api/reply', { visitorId: S.vid, messageId: id, content: text });
    S.draft[id] = '';
    S.boxOpen[id] = false;
    if (!S.replies[id]) S.replies[id] = [];
    S.replies[id].push(r.item);
    const m = S.items.find(x => x.id === id);
    if (m) m.reply_count = r.reply_count;
    renderFeed();
  } catch (err) {
    toast(err.message);
    btn.disabled = false;
    btn.textContent = '发送';
  }
}

/* ════════════════ 发帖 ════════════════ */
const box = $('#box');
box.addEventListener('input', () => { $('#cnt').textContent = box.value.length; });

async function submitPost() {
  const text = box.value.trim();
  if (!text) { box.focus(); return; }
  if (!S.vid) { toast('身份还没准备好，稍后再试'); return; }
  const btn = $('#send');
  btn.disabled = true;
  btn.textContent = '发送中…';
  try {
    await api('POST', '/api/message', {
      visitorId: S.vid,
      content: text,
      category: $('#catSel').value,
    });
    box.value = '';
    $('#cnt').textContent = '0';
    S.cat = '';
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.cat === ''));
    await loadPosts();
    await loadMe();
    toast('发送成功 🎉');
  } catch (err) {
    toast(err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '发送';
  }
}
$('#send').addEventListener('click', submitPost);
box.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') submitPost();
});

/* ════════════════ 分区 / 排序 / 更多 ════════════════ */
$('#tabs').addEventListener('click', async e => {
  const b = e.target.closest('button[data-cat]');
  if (!b) return;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  S.cat = b.dataset.cat;
  renderFeed();
  await loadPosts();
});
$('#sort').addEventListener('click', async e => {
  const b = e.target.closest('button[data-sort]');
  if (!b) return;
  document.querySelectorAll('#sort button').forEach(x => x.classList.toggle('on', x === b));
  S.sort = b.dataset.sort;
  await loadPosts();
});
$('#moreBtn').addEventListener('click', async () => {
  S.limit += 30;
  await loadPosts(true);
});

/* ════════════════ 启动 ════════════════ */
(async function boot() {
  applyTheme(document.documentElement.dataset.th || 'card');
  $('#feed').innerHTML = '<div class="loading">正在打开树洞…</div>';

  try {
    await loadConfig();
  } catch (err) {
    $('#feed').innerHTML = '<div class="empty"><span class="big">🔌</span>' + esc(err.message) + '</div>';
    return;
  }

  try {
    await ensureIdentity();
    await loadMe();
  } catch (err) {
    toast('身份初始化失败：' + err.message);
  }

  try {
    await loadPosts();
  } catch (err) {
    $('#feed').innerHTML = '<div class="empty"><span class="big">🔌</span>' + esc(err.message) + '</div>';
  }
})();
</script>
</body>
