name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm run docs:build
        env:
          # 树洞后端地址。在仓库 Settings → Secrets and variables → Actions → Variables
          # 里新建一个名为 VITE_TREEHOLE_API 的 Variable，值为 Worker 的 URL。
          # 未设置时为空串，树洞页会退回同域相对路径（显示「连不上服务」，其余页面不受影响）。
          VITE_TREEHOLE_API: ${{ vars.VITE_TREEHOLE_API }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment